<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- O Pixel da Meta e o Google Ads (gtag) NÃO carregam mais automaticamente aqui.
       Por exigência da Política de Cookies, cookies de publicidade só podem carregar
       depois que a pessoa escolhe aceitá-los no banner de consentimento — o carregamento
       real agora acontece via services/consentScripts.ts, disparado pelo
       CookieConsentBanner.tsx (ou automaticamente, se já houver uma escolha salva). -->

  <title>Simulador 60 Segundos</title>
  <meta name="theme-color" content="#0b1324" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="shortcut icon" type="image/png" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Simulador 60s" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f3f4f6;
    }

    @media print {
      body {
        background-color: white;
      }

      /* Ensure background colors (like stat cards) are printed */
      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      /* Hide scrollbars during print */
      ::-webkit-scrollbar {
        display: none;
      }
    }
  </style>


</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
